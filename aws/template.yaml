AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: QuantAI nightly warehouse refresh on Lambda (container image).

# 源码里没有任何账号 ID / 桶名字面量：账号与区域走 CloudFormation 伪参数，
# 桶名走 parameter（本机值在 gitignore 的 samconfig.toml 里）。换个账号同一份模板即可部署。

Parameters:
  DataBucket:
    Type: String
    Description: Existing S3 data lake bucket (created out of band, later managed by Terraform).
  ScheduleExpression:
    Type: String
    Default: cron(0 21 ? * MON-FRI *)
    Description: EventBridge Scheduler cron, evaluated in ScheduleTimezone.
  ScheduleTimezone:
    Type: String
    Default: America/New_York
    Description: Market-local timezone so the job tracks the close, not UTC drift.
  MemorySize:
    Type: Number
    Default: 1769
    Description: 1769 MB is one full vCPU; Phase 6 sweeps this for the cost knee.
  ApiKeyParameter:
    Type: String
    Default: /quantai/api-key
    Description: >
      SSM SecureString holding the shared secret. Only the NAME lives in this
      template - the value is set out of band, so no secret ever enters the
      template, the changeset, or CloudFormation state.

Resources:

  EtlLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-etl
      # 默认永不过期会无声长胖；这个任务每天一条，14 天足够排障。
      RetentionInDays: 14

  EtlRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        # 最小权限：只读写这一个桶的三个前缀，只写自己那个日志组。
        # 没有 s3:ListBucket、没有 s3:DeleteObject、没有通配桶、没有 logs:* on *。
        - PolicyName: etl-least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadWriteOwnPrefixesOnly
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${DataBucket}/exports/*
                  - !Sub arn:${AWS::Partition}:s3:::${DataBucket}/config/*
                  - !Sub arn:${AWS::Partition}:s3:::${DataBucket}/warehouse/*
              - Sid: WriteOwnLogStreamOnly
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${EtlLogGroup.Arn}:*

  EtlFunction:
    Type: AWS::Serverless::Function
    DependsOn: EtlLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-etl
      PackageType: Image
      Role: !GetAtt EtlRole.Arn
      # 本地容器实测 17-22s；300s 给足余量又不至于挂死到 15 分钟上限。
      Timeout: 300
      MemorySize: !Ref MemorySize
      # /tmp 要放云侧 duckdb（随新闻累积增长）+ CSV 导出。
      EphemeralStorage:
        Size: 1024
      Environment:
        Variables:
          QUANTAI_S3_BUCKET: !Ref DataBucket
      Events:
        Nightly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: !Ref ScheduleExpression
            ScheduleExpressionTimezone: !Ref ScheduleTimezone
            Description: QuantAI nightly warehouse refresh (after US close).
    Metadata:
      # DockerContext 是仓库根：Dockerfile 要 COPY quantai/ scripts/ warehouse/ configs/
      DockerContext: ..
      Dockerfile: aws/etl/Dockerfile
      DockerTag: latest

  # --------------------------------------------------------------- 计算 API

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v1
      # 限流是钱包的保险丝，与鉴权互相独立：即使 key 泄露也烧不动账单。
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: 14

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: api-least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # API 只读行情，连写权限都不给（和 ETL 角色是两个角色，权限不共用）。
              - Sid: ReadExportsOnly
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${DataBucket}/exports/*
              - Sid: ReadOwnApiKeyOnly
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApiKeyParameter}
              - Sid: DecryptViaSsmOnly
                Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                # kms:Decrypt 无法按资源收紧到默认托管密钥，改用条件把它锁死在 SSM 通道上。
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
              - Sid: WriteOwnLogStreamOnly
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${ApiLogGroup.Arn}:*

  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-api
      PackageType: Image
      Role: !GetAtt ApiRole.Arn
      Timeout: 15
      MemorySize: 1024
      Environment:
        Variables:
          QUANTAI_S3_BUCKET: !Ref DataBucket
          QUANTAI_API_KEY_PARAM: !Ref ApiKeyParameter
      Events:
        OptionsPrice:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /options/price
        Signals:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /signals
    Metadata:
      DockerContext: ..
      Dockerfile: aws/api/Dockerfile
      DockerTag: latest

Outputs:
  FunctionName:
    Value: !Ref EtlFunction
  LogGroup:
    Value: !Ref EtlLogGroup
  RoleArn:
    Value: !GetAtt EtlRole.Arn
  ApiEndpoint:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/v1
  ApiFunctionName:
    Value: !Ref ApiFunction
