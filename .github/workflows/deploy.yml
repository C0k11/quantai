name: deploy

# 测试 -> 构建镜像 -> 部署 -> 冒烟。
# 没有任何长期 AWS 密钥：deploy 这一步用 GitHub 签发的 OIDC token 现场换 1 小时的
# 短期凭据，而且 AWS 那边的信任策略只放行本仓库 main 分支签出来的 token。
#
# 仓库里不出现账号 ID / 桶名 / 仓库 URI：全部放在 repository secrets 里（不是 variables），
# 因为 public 仓库的 Actions 日志是公开的，secret 的值会被自动打码，variable 不会。

on:
  push:
    branches: [main]
    paths:
      - 'aws/**'
      # 压测结果只是数据：提交它不该重新构建、推镜像、部署（顺序有意义，! 要写在 aws/** 之后）。
      - '!aws/bench/**'
      - 'quantai/**'
      - 'scripts/**'
      - 'warehouse/**'
      - 'configs/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 同一时间只允许一个部署在跑，后来的排队，不互相踩 changeset。
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e ".[ui,warehouse,serve,dev]"
      - name: Test (includes the position-boundary tests)
        # pyproject 的 addopts 已带 -q；这里再加 -q 会叠成 -qq，pytest 就不打印
        # "N passed" 汇总行，CI 日志里只剩退出码、没有条数可查。
        run: python -m pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 只有这个 job 能向 GitHub 要 OIDC token；test job 拿不到。
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Assume deploy role via OIDC (no long-lived keys)
        id: aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ca-central-1
          mask-aws-account-id: true

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Build images
        run: sam build --template-file aws/template.yaml

      - name: Deploy through CloudFormation (execution role creates the resources)
        # sam deploy 结束时打印栈 Outputs，其中 ApiEndpoint 不含账号 ID，不会被自动打码；
        # public 仓库日志公开，所以把 execute-api 的 API ID 换成 ***（CI #3/#4 实测各漏过一次）。
        run: |
          set -euo pipefail
          sam deploy \
            --stack-name quantai-etl \
            --region ca-central-1 \
            --role-arn "${{ secrets.CFN_EXEC_ROLE_ARN }}" \
            --s3-bucket "${{ secrets.SAM_ARTIFACT_BUCKET }}" \
            --image-repositories "EtlFunction=${{ secrets.ECR_ETL_REPO }}" \
            --image-repositories "ApiFunction=${{ secrets.ECR_API_REPO }}" \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
            "DataBucket=${{ secrets.DATA_BUCKET }}" \
            "AlarmEmail=${{ secrets.ALARM_EMAIL }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            2>&1 | sed -E 's#https://[a-z0-9]+\.execute-api\.#https://***.execute-api.#g'

      - name: Warm up the API image
        # init 阶段会导入 scipy、pandas 和信号模块，所以一个不带 key 的请求（401）就能预热一个执行环境。
        # 新镜像的头几个执行环境要付一次冷加载代价（实测首调 7.2 s、6.0 s，之后约 2 s），这里并发打三路，
        # 每路重试到拿到 401 为止，让这笔代价落在 CI 上而不是第一个真实请求上；CI 不持有 API key。
        # 尽力而为：失败只告警，不把已经成功的部署标红。地址和 API id 先打码，输出只有状态码、耗时和 curl 退出码。
        # Actions 默认 bash -e：curl 传输层失败（超时等）会让这一路静默退出，所以 curl 那一行必须 || true。
        continue-on-error: true
        run: |
          set -uo pipefail
          endpoint=$(aws cloudformation describe-stacks --stack-name quantai-etl \
            --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" --output text)
          echo "::add-mask::$endpoint"
          api_id=${endpoint#https://}; api_id=${api_id%%.*}
          if [ -n "$api_id" ]; then echo "::add-mask::$api_id"; fi
          warm() {
            local seen=""
            for attempt in 1 2 3 4 5 6; do
              res=$(curl -s -o /dev/null -w '%{http_code} %{time_total}s rc=%{exitcode}' --max-time 35 -X POST \
                      "$endpoint/options/price" -H 'content-type: application/json' -d '{}') || true
              echo "warm-up $1 attempt $attempt: $res"
              if [ "${res%% *}" = "401" ]; then
                if [ -n "$seen" ]; then echo "::warning::warm-up $1 needed $attempt attempts (earlier:$seen)"; fi
                return 0
              fi
              seen="$seen ${res%% *}"
              if [ "$attempt" -lt 6 ]; then sleep 5; fi
            done
            echo "::warning::warm-up $1 never got a 401 (codes:$seen)"
          }
          for i in 1 2 3; do warm "$i" & done
          wait

      - name: Smoke test
        run: |
          set -euo pipefail
          for fn in quantai-etl-etl quantai-etl-api; do
            state=$(aws lambda get-function-configuration --function-name "$fn" \
              --query '[State,LastUpdateStatus]' --output text)
            echo "$fn: $state"
            [ "$state" = "Active	Successful" ] || { echo "::error::$fn not healthy"; exit 1; }
          done
          endpoint=$(aws cloudformation describe-stacks --stack-name quantai-etl \
            --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" --output text)
          # CI 故意不持有 API key：没 key 必须 401。这同时证明服务活着、且鉴权是 fail closed。
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$endpoint/options/price" \
            -H 'content-type: application/json' -d '{"S":100,"K":100,"T":0.5,"sigma":0.2}')
          echo "unauthenticated POST /options/price -> $code"
          [ "$code" = "401" ] || { echo "::error::expected 401, got $code"; exit 1; }

      - name: Health check (the API key is readable)
        # 401 分不清「鉴权正常」和「key 根本读不到」，两种情况都是 401。GET /health 不带 key，只有服务它的
        # 执行环境读到了 key 才回 200 {"ready": true}。读失败后 60 秒内不再重试（从那次读开始算），所以这里重试约 80 秒。
        # 失败会把 workflow 标红，但栈已经在新版本上（pin 照样跑）。地址先打码，每次只打状态码、curl 退出码和 ready，
        # 不打响应体；响应文件每次先清空，免得一次传输失败读到上一次的内容。
        run: |
          set -uo pipefail
          endpoint=$(aws cloudformation describe-stacks --stack-name quantai-etl \
            --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" --output text)
          echo "::add-mask::$endpoint"
          api_id=${endpoint#https://}; api_id=${api_id%%.*}
          if [ -n "$api_id" ]; then echo "::add-mask::$api_id"; fi
          for attempt in 1 2 3 4 5 6 7 8 9; do
            : > "$RUNNER_TEMP/health.json"
            res=$(curl -s -o "$RUNNER_TEMP/health.json" -w '%{http_code} rc=%{exitcode}' --max-time 35 "$endpoint/health") || true
            ready=$(jq -r '.ready // false' "$RUNNER_TEMP/health.json" 2>/dev/null) || ready=false
            echo "health attempt $attempt: $res ready=${ready:-false}"
            if [ "$ready" = "true" ]; then exit 0; fi
            if [ "$attempt" -lt 9 ]; then sleep 10; fi
          done
          echo "::error::GET /health never answered ready=true (status and curl exit code of each attempt above)"
          exit 1

      - name: Pin the image each function runs
        # ECR 生命周期规则 1 只护带 deployed 标签的镜像，这里把标签打在 Lambda 实际在跑的 digest 上。
        # always()：部署或冒烟失败时函数仍在跑旧镜像，标签也要留在它身上。
        # --image-digest：manifest 字节对不上时 ECR 直接拒绝，而不是悄悄生成一张新镜像去打标签。
        # 函数跑的镜像不在 CI 仓库里（例如迁移中途失败）只告警不打标签。输出不含仓库 URI。
        if: ${{ always() && steps.aws.outcome == 'success' }}
        env:
          ETL_REPO_URI: ${{ secrets.ECR_ETL_REPO }}
          API_REPO_URI: ${{ secrets.ECR_API_REPO }}
        run: |
          set -uo pipefail
          pin() {
            fn=$1; repo=$2
            sha=$(aws lambda get-function-configuration --function-name "$fn" --query CodeSha256 --output text) || return 1
            digest="sha256:$sha"
            img=$(aws ecr batch-get-image --repository-name "$repo" --image-ids imageDigest="$digest" \
                    --query 'images[0]' --output json) || return 1
            if [ "$img" = "null" ]; then
              echo "::warning::$fn runs an image outside its CI repository; not pinned"; return 0
            fi
            jq -j '.imageManifest' <<<"$img" > "$RUNNER_TEMP/manifest.json"
            mtype=$(jq -r '.imageManifestMediaType' <<<"$img")
            if out=$(aws ecr put-image --repository-name "$repo" --image-tag deployed --image-digest "$digest" \
                       --image-manifest-media-type "$mtype" --image-manifest "file://$RUNNER_TEMP/manifest.json" 2>&1 >/dev/null); then
              echo "$fn: pinned ${sha:0:12}"
            elif grep -q ImageAlreadyExistsException <<<"$out"; then
              echo "$fn: already pinned ${sha:0:12}"
            else
              echo "::error::$fn: put-image failed"; sed -E 's/[0-9]{12}/***/g' <<<"$out"; return 1
            fi
          }
          rc=0
          pin quantai-etl-etl "${ETL_REPO_URI#*/}" || rc=1
          pin quantai-etl-api "${API_REPO_URI#*/}" || rc=1
          exit $rc
